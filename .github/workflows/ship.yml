name: ship

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config cmake

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "Cython<3.0" "setuptools<71.0.0" buildozer

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          free -h

      - name: Limit parallelism to 1
        run: |
          echo "MAKEFLAGS=-j1" >> $GITHUB_ENV
          echo "GRADLE_OPTS=-Dorg.gradle.workers.max=1 -Dorg.gradle.jvmargs=-Xmx2g" >> $GITHUB_ENV

      - name: Force buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Lichnii Dohodyaga
          package.name = lichdohod
          package.domain = org.dohodyaga
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,mp3,ogg,wav
          version = 0.1
          requirements = python3==3.10.12,hostpython3==3.10.12,kivy==2.3.0,pyjnius==1.5.0,pygame-ce,cython<3.0
          orientation = portrait
          fullscreen = 1
          android.api = 33
          android.minapi = 24
          android.ndk = 28c
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.build_tools_version = 34.0.0
          android.debug_art = 0
          p4a.branch = master

          [buildozer]
          log_level = 1
          warn_on_root = 1
          EOF

      - name: Install aidl
        run: |
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" || true

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
